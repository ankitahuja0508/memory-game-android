<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Brain Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .link-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px 30px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .link-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .link-card .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }
        .link-card .title {
            font-weight: 600;
            font-size: 1rem;
        }
        .footer {
            margin-top: 60px;
            color: #718096;
            font-size: 0.9rem;
        }
        .footer a {
            color: #00d9ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>Memory Match</h1>
        <p class="subtitle">Brain Training Game</p>
        
        <div class="links">
            <a href="/privacy-policy" class="link-card">
                <div class="icon">🔒</div>
                <div class="title">Privacy Policy</div>
            </a>
            <a href="/terms-of-service" class="link-card">
                <div class="icon">📜</div>
                <div class="title">Terms of Service</div>
            </a>
        </div>
        
        <div class="footer">
            <p>© 2025 Stupefying Labs. All rights reserved.</p>
            <p style="margin-top: 10px; font-size: 0.85rem;">Contact: <a href="mailto:stupefyinglabs@gmail.com">stupefyinglabs@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
