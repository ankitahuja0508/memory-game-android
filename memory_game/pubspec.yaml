name: memory_game
description: A beautiful memory matching game with gamification features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Storage
  shared_preferences: ^2.5.3

  # Audio
  audioplayers: ^6.4.0

  # UI & Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.4
  flutter_staggered_animations: ^1.1.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
