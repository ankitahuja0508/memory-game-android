name: memory_game
description: A beautiful memory matching game with gamification features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Storage
  shared_preferences: ^2.2.2

  # Audio
  audioplayers: ^5.2.1

  # UI & Animations
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/
    - assets/images/
    - assets/fonts/
