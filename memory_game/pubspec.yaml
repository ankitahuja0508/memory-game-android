name: memory_game
description: A beautiful memory matching game with gamification features.
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Storage
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9
  firebase_remote_config: ^4.3.8
  firebase_messaging: ^14.7.10

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # Sharing & Screenshots
  share_plus: ^7.2.1
  screenshot: ^3.0.0
  path_provider: ^2.1.1

  # Rate App
  in_app_review: ^2.0.8

  # URL Launcher
  url_launcher: ^6.2.1
  http: ^1.1.0

  # Audio
  audioplayers: ^5.2.1

  # UI & Animations
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2979FF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/
    - assets/images/
    - assets/fonts/
